name: Build and test

on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: [main, 'feature/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check Expo app
        run: npx tsc --noEmit

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kitchenai
          POSTGRES_USER: kitchenai
          POSTGRES_PASSWORD: kitchenai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchenai -d kitchenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Flyway and PostgreSQL recipe discovery integration test
        env:
          RUN_POSTGRES_INTEGRATION: "true"
          DATABASE_URL: jdbc:postgresql://localhost:5432/kitchenai
          DATABASE_USERNAME: kitchenai
          DATABASE_PASSWORD: kitchenai
        run: mvn --batch-mode -Dtest=PantryRecipeMatchPostgresTest test
