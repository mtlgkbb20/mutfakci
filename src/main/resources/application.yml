server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kitchenai}
    username: ${DATABASE_USERNAME:kitchenai}
    password: ${DATABASE_PASSWORD:kitchenai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_IMAGE_REQUEST_SIZE:12MB}
jwt:
  secret: ${JWT_SECRET:change-me-in-development-to-a-long-secret-key}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  ai:
    runware:
      api-key: ${RUNWARE_API_KEY:}
      model: ${RUNWARE_MODEL:deepseek:v4.1@flash}
      vision-model: ${RUNWARE_VISION_MODEL:google:gemini@3.1-pro}
      text-fallback-model: ${RUNWARE_TEXT_FALLBACK_MODEL:deepseek:v4.1@flash}
      normalizer-model: ${RUNWARE_NORMALIZER_MODEL:deepseek:v4.1@flash}
