server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: runware
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kitchenai}
    username: ${DATABASE_USERNAME:kitchenai}
    password: ${DATABASE_PASSWORD:kitchenai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_IMAGE_REQUEST_SIZE:40MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
security:
  otp:
    hash-secret: ${OTP_HASH_SECRET:${JWT_SECRET}}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    from: ${EMAIL_FROM:no-reply@your-domain.example}
  storage-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  ai:
    runware:
      api-key: ${RUNWARE_API_KEY:}
      model: ${RUNWARE_MODEL:deepseek:v4.1@flash}
      vision-model: ${RUNWARE_VISION_MODEL:google:gemini@3.1-pro}
      text-fallback-model: ${RUNWARE_TEXT_FALLBACK_MODEL:google:gemini@3.1-flash-lite}
      normalizer-model: ${RUNWARE_NORMALIZER_MODEL:google:gemini@3.1-flash-lite}
  payments:
    provider: ${PAYMENT_PROVIDER:paytr}
    callback-url: ${PAYMENT_CALLBACK_URL:}
  membership:
    clock-zone: Europe/Istanbul
